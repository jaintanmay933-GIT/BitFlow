<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitFlow // Video Pipeline Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <div class="max-w-4xl mx-auto py-12 px-4">
        <header class="border-b border-slate-800 pb-6 mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">BitFlow</h1>
            <p class="text-slate-400 text-sm mt-1">Distributed High-Performance Video Transcoding System Architecture</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Upload Panel -->
            <div class="md:col-span-1 bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-xl h-fit">
                <h2 class="text-lg font-bold mb-4 text-cyan-400">Ingest Media</h2>
                <form id="transcodeForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold tracking-wider uppercase text-slate-400 mb-1">Video Title</label>
                        <input type="text" id="videoTitle" required placeholder="Big Buck Bunny" 
                               class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold tracking-wider uppercase text-slate-400 mb-1">Select Video File</label>
                        <input type="file" id="videoFile" required accept="video/*" 
                               class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-sm text-slate-200 file:mr-4 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-cyan-600 file:text-slate-950 hover:file:bg-cyan-500 cursor-pointer focus:outline-none transition">
                    </div>
                    <button type="submit" id="submitBtn" 
                            class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold py-2 rounded-lg text-sm tracking-wide transition active:scale-[0.98] disabled:opacity-50">
                        Dispatch to Cluster
                    </button>
                </form>
            </div>

            <!-- Cluster Task Queue -->
            <div class="md:col-span-2 bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-xl">
                <h2 class="text-lg font-bold mb-4 text-cyan-400">Active Node Cluster Tasks</h2>
                <div id="jobQueue" class="space-y-4">
                    <p id="emptyState" class="text-sm text-slate-500 text-center py-8">No tasks in current pipeline. Queue a file on the left panel to initialize.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Centralized API Configuration
        const API_BASE_URL = 'https://bitflow-backend-047r.onrender.com';

        const form = document.getElementById('transcodeForm');
        const queueContainer = document.getElementById('jobQueue');
        const emptyState = document.getElementById('emptyState');
        const submitBtn = document.getElementById('submitBtn');
        const activePolls = {};

        // 1. Fetch Existing Tasks on Page Load / Refresh
        async function loadExistingJobs() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/jobs`);
                const data = await response.json();

                if (data.jobs && data.jobs.length > 0) {
                    data.jobs.forEach(job => {
                        appendJobToDashboard(job.jobId, job.title, job.status, job.progress || 0, false);

                        if (job.status === 'PENDING' || job.status === 'PROCESSING') {
                            trackJobProgress(job.jobId);
                        }
                    });
                }
            } catch (err) {
                console.error("Failed to restore task queue from database:", err);
            }
        }

        // Initialize queue recovery on DOM load
        document.addEventListener('DOMContentLoaded', loadExistingJobs);

        // 2. Submit New Transcoding Task
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('videoTitle').value;
            const fileInput = document.getElementById('videoFile');
            const file = fileInput.files[0];

            if (!file) return;

            submitBtn.disabled = true;
            submitBtn.innerText = 'Uploading to Cluster...';

            const formData = new FormData();
            formData.append('title', title);
            formData.append('video', file); 

            try {
                const response = await fetch(`${API_BASE_URL}/api/transcode`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (data.success) {
                    form.reset();
                    appendJobToDashboard(data.videoId, title, 'PENDING', 0, true);
                    trackJobProgress(data.videoId);
                } else {
                    alert('Upload failed: ' + (data.error || 'Unknown error'));
                }
            } catch (err) {
                console.error("Pipeline target connection error:", err);
                alert('Server connection failed. Could not reach backend API at ' + API_BASE_URL);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Dispatch to Cluster';
            }
        });

        // 3. Append or Render Task Card
        function appendJobToDashboard(id, title, initialStatus = 'PENDING', initialProgress = 0, isNewSubmission = false) {
            const emptyStateNode = document.getElementById('emptyState');
            if (emptyStateNode) emptyStateNode.remove();

            if (document.getElementById(`job-${id}`)) return;

            const card = document.createElement('div');
            card.id = `job-${id}`;
            card.className = "bg-slate-950 border border-slate-800 p-4 rounded-lg space-y-3 shadow-inner";
            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <div>
                        <h4 class="text-sm font-semibold text-slate-200">${title}</h4>
                        <span class="text-[10px] font-mono text-slate-500">${id}</span>
                    </div>
                    <span id="status-${id}" class="text-[10px] font-bold tracking-wider uppercase px-2 py-0.5 rounded border">
                        ${initialStatus}
                    </span>
                </div>
                <div class="w-full bg-slate-900 rounded-full h-1.5 overflow-hidden">
                    <div id="progress-${id}" class="bg-cyan-500 h-1.5 transition-all duration-300" style="width: ${initialProgress}%"></div>
                </div>
                <!-- 🎬 Stream Container for completed video player -->
                <div id="stream-container-${id}" class="hidden pt-2"></div>
            `;

            if (isNewSubmission) {
                queueContainer.prepend(card);
            } else {
                queueContainer.appendChild(card);
            }

            applyStatusStyle(id, initialStatus, initialProgress);

            if (initialStatus === 'COMPLETED') {
                showStreamPlayer(id, `${API_BASE_URL}/stream/${id}.mp4`);
            }
        }

        // 4. Update Status Badges and Progress Bar UI
        function applyStatusStyle(id, status, progress) {
            const statusBadge = document.getElementById(`status-${id}`);
            const progressFill = document.getElementById(`progress-${id}`);

            if (progressFill) progressFill.style.width = `${progress}%`;

            if (!statusBadge) return;

            statusBadge.innerText = `${status} (${progress}%)`;

            if (status === 'PROCESSING') {
                statusBadge.className = "text-[10px] font-bold tracking-wider uppercase bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded border border-blue-500/20";
            } else if (status === 'COMPLETED') {
                statusBadge.className = "text-[10px] font-bold tracking-wider uppercase bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20";
            } else if (status === 'FAILED') {
                statusBadge.className = "text-[10px] font-bold tracking-wider uppercase bg-rose-500/10 text-rose-400 px-2 py-0.5 rounded border border-rose-500/20";
            } else {
                statusBadge.className = "text-[10px] font-bold tracking-wider uppercase bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/20";
            }
        }

        // 5. Inject Playable Video Stream Element
        function showStreamPlayer(id, streamUrl) {
            const streamContainer = document.getElementById(`stream-container-${id}`);
            if (streamContainer && streamUrl) {
                streamContainer.classList.remove('hidden');
                streamContainer.innerHTML = `
                    <div class="mt-2 space-y-1">
                        <span class="text-[10px] font-semibold text-emerald-400 uppercase tracking-wider">Stream Ready</span>
                        <video controls class="w-full rounded-lg border border-slate-800 bg-black max-h-64">
                            <source src="${streamUrl}" type="video/mp4">
                            Your browser does not support video playback.
                        </video>
                    </div>
                `;
            }
        }

        // 6. Live Status Polling Loop
        function trackJobProgress(id) {
            if (activePolls[id]) return;

            activePolls[id] = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/status/${id}`);
                    const data = await response.json();

                    if (!data.success) return;

                    applyStatusStyle(id, data.status, data.progress);

                    if (data.status === 'COMPLETED') {
                        if (data.streamUrl) {
                            showStreamPlayer(id, data.streamUrl);
                        }
                        clearInterval(activePolls[id]);
                        delete activePolls[id];
                    } else if (data.status === 'FAILED') {
                        clearInterval(activePolls[id]);
                        delete activePolls[id];
                    }
                } catch (err) {
                    console.error("Polling database checkpoint failure:", err);
                }
            }, 1000);
        }
    </script>
</body>
</html>
